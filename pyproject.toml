[project]
name = "log-forensics-engine"
version = "1.0.0"
description = "Streaming log analyser: regex parsing, KNN severity classification, k-NN anomaly detection and a live dashboard."
requires-python = ">=3.12"
# Runtime dependencies (what the deployed dashboard needs). requirements.txt
# lists these plus the dev tools below, for plain `pip install -r`.
dependencies = [
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "psutil==7.2.2",
    "paramiko==5.1.0",
    "fastapi==0.160.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:paramiko.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]  # zip() without strict= is intentional on equal-length streams

[tool.ruff.lint.isort]
known-local-folder = ["dashboard", "engine", "evaluate", "featurizer", "log_parser", "log_source",
                      "memory_benchmark", "models", "remote_sources", "synthetic_logs", "ssh_test_server"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # realistic log lines in test data are long
